services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      # Required. Generate one with:  export SECRET_KEY=$(openssl rand -hex 32)
      # Compose fails to start if it is unset, so there is no weak default.
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set - run: export SECRET_KEY=$(openssl rand -hex 32)}
    volumes:
      # Persist server-side session files across restarts.
      - bulkexc_sessions:/tmp/bulkexc_sessions

volumes:
  bulkexc_sessions:
